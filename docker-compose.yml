version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: db
    environment:
      POSTGRES_DB: database
      POSTGRES_USER: app_database
      POSTGRES_PASSWORD: app_database

    volumes:
      - backend_vol:/var/lib/postgresql/data
      - ./taskAPI/sql/init.sql:/docker-entrypoint-initdb.d/init.sql

    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_database -d database"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: backend
    networks:
      - backend_net
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: database
      DB_USER: app_database
      DB_PASSWORD: app_database
    ports:
      - 8080:8080
    volumes:
      - ./taskAPI:/app/taskAPI

volumes:
  backend_vol:
    name: "backend_vol"
networks:
  backend_net:
    name: "backend_net"