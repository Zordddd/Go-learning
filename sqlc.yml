version: '2'

sql:
  - schema: "taskAPI/db/schema.sql"
    queries: "taskAPI/db/queries"
    engine: "postgresql"
    gen:
      go:
        out: "taskAPI/internal/store"
        package: "store"
        emit_json_tags: true
        emit_prepared_queries: true
        emit_interface: true
        sql_package: "pgx/v5"